name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codegen-check:
    name: Generated SDK Sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install generator dependencies
        run: uv sync --extra dev

      - name: Check generated sources
        run: uv run python -m tools.codegen check

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: packages/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm typecheck:integration

      - name: Unit tests
        run: pnpm test

      - name: Build package
        run: pnpm build

  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/vodoo

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v

  integration-test:
    name: Community Integration – Odoo ${{ matrix.odoo-version }}
    needs: [codegen-check, typescript, lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        odoo-version: [17, 18, 19]
        include:
          - odoo-version: 17
            port: 17069
          - odoo-version: 18
            port: 18069
          - odoo-version: 19
            port: 19069
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: packages/typescript/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras
          pnpm --dir packages/typescript install --frozen-lockfile

      - name: Start Odoo ${{ matrix.odoo-version }}
        working-directory: tests/integration
        run: |
          ODOO_IMAGE="odoo:${{ matrix.odoo-version }}.0" \
          ODOO_PORT="${{ matrix.port }}" \
          ODOO_CONF="odoo.conf" \
          docker compose -p "vodoo-test-${{ matrix.odoo-version }}" \
            -f docker-compose.yml up -d --wait --wait-timeout 180

      - name: Provision Odoo ${{ matrix.odoo-version }}
        run: |
          uv run python tests/integration/setup_odoo.py \
            --port ${{ matrix.port }} \
            --version ${{ matrix.odoo-version }} \
            --project "vodoo-test-${{ matrix.odoo-version }}" \
            --db-name "vodoo_test_${{ matrix.odoo-version }}"

      - name: Run Python integration tests
        run: |
          VODOO_TEST_ENV="tests/integration/.env.test.${{ matrix.odoo-version }}" \
          uv run python -m pytest tests/integration/test_suite.py tests/integration/test_async_suite.py \
            -v --tb=short -x \
            --odoo-version ${{ matrix.odoo-version }}

      - name: Run TypeScript integration tests
        run: |
          set -a
          source "tests/integration/.env.test.${{ matrix.odoo-version }}"
          set +a
          pnpm --dir packages/typescript test:integration

      - name: Dump logs on failure
        if: failure()
        working-directory: tests/integration
        run: |
          docker compose -p "vodoo-test-${{ matrix.odoo-version }}" logs --tail=100

      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: |
          docker compose -p "vodoo-test-${{ matrix.odoo-version }}" down -v --remove-orphans
