name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codegen-check:
    name: Generated SDK Sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install generator dependencies
        run: uv sync --extra dev

      - name: Check generated sources
        run: uv run python -m tools.codegen check

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: packages/typescript/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python package tooling
        working-directory: ${{ github.workspace }}
        run: uv sync --extra dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm typecheck:integration

      - name: Unit tests
        run: pnpm test

      - name: Cloudflare workerd smoke test
        run: pnpm test:worker

      - name: Build package
        run: pnpm build

      - name: Stage and verify publishable package
        working-directory: ${{ github.workspace }}
        run: |
          uv run python scripts/stage_typescript_package.py --output /tmp/vodoo-npm
          npm pack /tmp/vodoo-npm --pack-destination /tmp > /tmp/vodoo-pack-name
          mkdir /tmp/vodoo-consumer
          cd /tmp/vodoo-consumer
          npm init -y >/dev/null
          npm install "/tmp/$(cat /tmp/vodoo-pack-name)"
          node --input-type=module -e \
            'import { Cmd, OdooClient } from "vodoo"; if (Cmd.set([1])[2][0] !== 1 || typeof OdooClient !== "function") process.exit(1)'

  swift:
    name: Swift SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build and run shared conformance tests with coverage
        run: swift test --enable-code-coverage

      - name: Enforce Swift coverage thresholds
        run: |
          COVERAGE_PATH="$(swift test --show-codecov-path)"
          python3 scripts/check_swift_coverage.py "$COVERAGE_PATH"

      - name: Store Swift coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-coverage
          path: .build/**/codecov/Vodoo.json
          include-hidden-files: true
          if-no-files-found: error

  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/vodoo

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v

  integration-test:
    name: Community Integration – Odoo ${{ matrix.odoo-version }}
    needs: [codegen-check, typescript, swift, lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        odoo-version: [17, 18, 19]
        include:
          - odoo-version: 17
            port: 17069
          - odoo-version: 18
            port: 18069
          - odoo-version: 19
            port: 19069
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: packages/typescript/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras
          pnpm --dir packages/typescript install --frozen-lockfile

      - name: Start Odoo ${{ matrix.odoo-version }}
        working-directory: tests/integration
        run: |
          ODOO_IMAGE="odoo:${{ matrix.odoo-version }}.0" \
          ODOO_PORT="${{ matrix.port }}" \
          ODOO_CONF="odoo.conf" \
          docker compose -p "vodoo-test-${{ matrix.odoo-version }}" \
            -f docker-compose.yml up -d --wait --wait-timeout 180

      - name: Provision Odoo ${{ matrix.odoo-version }}
        run: |
          uv run python tests/integration/setup_odoo.py \
            --port ${{ matrix.port }} \
            --version ${{ matrix.odoo-version }} \
            --project "vodoo-test-${{ matrix.odoo-version }}" \
            --db-name "vodoo_test_${{ matrix.odoo-version }}"

      - name: Run Python integration tests
        run: |
          VODOO_TEST_ENV="tests/integration/.env.test.${{ matrix.odoo-version }}" \
          uv run python -m pytest tests/integration/test_suite.py tests/integration/test_async_suite.py \
            -v --tb=short -x \
            --odoo-version ${{ matrix.odoo-version }}

      - name: Run TypeScript integration tests
        run: |
          set -a
          source "tests/integration/.env.test.${{ matrix.odoo-version }}"
          set +a
          pnpm --dir packages/typescript test:integration

      - name: Run Swift integration smoke test
        run: |
          set -a
          source "tests/integration/.env.test.${{ matrix.odoo-version }}"
          set +a
          swift test --filter LiveIntegrationTests

      - name: Dump logs on failure
        if: failure()
        working-directory: tests/integration
        run: |
          docker compose -p "vodoo-test-${{ matrix.odoo-version }}" logs --tail=100

      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: |
          docker compose -p "vodoo-test-${{ matrix.odoo-version }}" down -v --remove-orphans

  enterprise-integration-test:
    name: Enterprise Integration – Odoo ${{ matrix.odoo-version }}
    # The enterprise-ci environment's deployment policy permits only main, so
    # its proprietary download credential is unavailable to pull-request refs.
    if: github.event_name == 'push'
    environment: enterprise-ci
    needs: [codegen-check, typescript, swift, lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - odoo-version: 17
            port: 17169
          - odoo-version: 18
            port: 18169
          - odoo-version: 19
            port: 19169
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: packages/typescript/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras
          pnpm --dir packages/typescript install --frozen-lockfile

      - name: Store the protected Odoo download credential
        env:
          ODOO_ENTERPRISE_KEY: ${{ secrets.ODOO_ENTERPRISE_KEY }}
        run: |
          test -n "$ODOO_ENTERPRISE_KEY"
          umask 077
          printf '%s' "$ODOO_ENTERPRISE_KEY" > .odoo-license

      - name: Fetch official Odoo ${{ matrix.odoo-version }} Enterprise source
        run: uv run python tests/integration/fetch_enterprise.py fetch ${{ matrix.odoo-version }}

      - name: Build local Odoo ${{ matrix.odoo-version }} Enterprise image
        run: ENTERPRISE_BUILD_ONLY=1 ./tests/integration/run.sh ${{ matrix.odoo-version }}

      - name: Start Odoo ${{ matrix.odoo-version }} Enterprise
        working-directory: tests/integration
        run: |
          ODOO_IMAGE="vodoo-odoo-ee:${{ matrix.odoo-version }}.0" \
          ODOO_PORT="${{ matrix.port }}" \
          ODOO_CONF="odoo-enterprise.conf" \
          docker compose -p "vodoo-test-${{ matrix.odoo-version }}ee" \
            -f docker-compose.yml up -d --wait --wait-timeout 240

      - name: Provision Odoo ${{ matrix.odoo-version }} Enterprise
        run: |
          uv run python tests/integration/setup_odoo.py \
            --port ${{ matrix.port }} \
            --version ${{ matrix.odoo-version }} \
            --project "vodoo-test-${{ matrix.odoo-version }}ee" \
            --db-name "vodoo_test_${{ matrix.odoo-version }}ee" \
            --enterprise

      - name: Run Python Enterprise integration tests
        run: |
          VODOO_TEST_ENV="tests/integration/.env.test.${{ matrix.odoo-version }}ee" \
          uv run python -m pytest tests/integration/test_suite.py tests/integration/test_async_suite.py \
            -v --tb=short -x \
            --odoo-version ${{ matrix.odoo-version }}

      - name: Run TypeScript Enterprise integration tests
        run: |
          set -a
          source "tests/integration/.env.test.${{ matrix.odoo-version }}ee"
          set +a
          pnpm --dir packages/typescript test:integration

      - name: Dump logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose -p "vodoo-test-${{ matrix.odoo-version }}ee" logs --tail=100

      - name: Remove containers and proprietary local files
        if: always()
        run: |
          rm -rf .odoo-license .odoo-enterprise || true
          docker compose -p "vodoo-test-${{ matrix.odoo-version }}ee" \
            -f tests/integration/docker-compose.yml down -v --remove-orphans || true
          docker image rm "vodoo-odoo-ee:${{ matrix.odoo-version }}.0" || true
          docker builder prune --force || true
