name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # needed for gh-pages deployment

jobs:
  validate-release:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Verify release tag checkout
      if: github.event_name == 'release'
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - uses: pnpm/action-setup@v4
      with:
        version: 10.15.0

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
        cache-dependency-path: packages/typescript/pnpm-lock.yaml

    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.0"

    - name: Install dependencies
      run: |
        uv sync --all-extras
        pnpm --dir packages/typescript install --frozen-lockfile

    - name: Validate generated and Python sources
      run: |
        uv run python -m tools.codegen check
        uv run ruff check .
        uv run ruff format --check .
        uv run mypy src/vodoo
        uv run pytest tests/ --ignore=tests/integration -q

    - name: Validate TypeScript and workerd package
      run: |
        pnpm --dir packages/typescript format:check
        pnpm --dir packages/typescript typecheck
        pnpm --dir packages/typescript typecheck:integration
        pnpm --dir packages/typescript test
        pnpm --dir packages/typescript test:worker
        pnpm --dir packages/typescript build
        uv run python scripts/stage_typescript_package.py --output /tmp/vodoo-npm
        npm pack /tmp/vodoo-npm --pack-destination /tmp

    - name: Validate Swift package
      run: |
        swift test --enable-code-coverage
        python3 scripts/check_swift_coverage.py "$(swift test --show-codecov-path)"

  build:
    name: Build distribution
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vodoo
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  stage-on-npm:
    name: Stage TypeScript package on npm
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: validate-release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/vodoo
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - uses: pnpm/action-setup@v4
      with:
        version: 10.15.0

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        registry-url: https://registry.npmjs.org
        cache: pnpm
        cache-dependency-path: packages/typescript/pnpm-lock.yaml

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install npm with staged publishing support
      run: npm install --global npm@12.0.2

    - name: Install build dependencies
      run: |
        uv sync --extra dev
        pnpm --dir packages/typescript install --frozen-lockfile

    - name: Build and stage npm package
      env:
        RELEASE_VERSION: ${{ github.event.release.tag_name }}
      run: |
        pnpm --dir packages/typescript build
        uv run python scripts/stage_typescript_package.py \
          --output dist/npm \
          --version "$RELEASE_VERSION"
        npm pack --dry-run ./dist/npm

    - name: Stage npm package for 2FA approval
      working-directory: dist/npm
      run: npm stage publish --access public --provenance

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vodoo
    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  deploy-docs:
    name: Deploy documentation
    needs:
    - build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # needed for hatch-vcs and mike

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra docs

    - name: Generate CLI reference
      run: uv run python scripts/gen_cli_docs.py

    - name: Configure git for mike
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Deploy versioned docs
      run: |
        # Extract version from tag (v1.2.3 -> 1.2.3) or fall back to git describe
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION=$(uv run python -c "from importlib.metadata import version; print(version('vodoo'))")
        fi
        echo "Deploying docs for version: $VERSION"
        uv run mike deploy --push --update-aliases "$VERSION" latest
        uv run mike set-default --push latest
