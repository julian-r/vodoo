pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    mypy:
      glob: "*.py"
      run: uv run mypy src/vodoo
    gitleaks:
      run: gitleaks protect --staged --no-banner
