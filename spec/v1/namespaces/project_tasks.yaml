specVersion: 1
namespace: project_tasks
className: Task
model: project.task
recordType: Task
tagModel: project.tags
capabilities:
- crud
- messaging
- tags
- attachments
availability:
  module: project
  editions:
  - community
  - enterprise
  minVersion: 17
defaultFields:
- id
- name
- partner_id
- project_id
- stage_id
- user_ids
- priority
- tag_ids
- create_date
defaultDetailFields: null
dateFields:
  create_date: datetime
fieldSets: {}
operations: []
customOperations:
- name: create
  description: Create a project task.
  targets:
  - python
  - asyncPython
  - typescript
- name: setMilestone
  description: Assign a milestone after validating project membership.
  targets:
  - python
  - asyncPython
  - typescript
- name: addDependencies
  description: Add task dependencies.
  targets:
  - python
  - asyncPython
  - typescript
- name: clearDependencies
  description: Clear task dependencies.
  targets:
  - python
  - asyncPython
  - typescript
- name: schedule
  description: Set task schedule fields.
  targets:
  - python
  - asyncPython
  - typescript
- name: createTag
  description: Create a project tag.
  targets:
  - python
  - asyncPython
  - typescript
- name: deleteTag
  description: Delete a project tag.
  targets:
  - python
  - asyncPython
  - typescript
