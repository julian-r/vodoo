specVersion: 1
namespace: documents
className: Document
model: documents.document
recordType: Document
capabilities:
- crud
- messaging
- attachments
availability:
  module: documents
  editions:
  - enterprise
  minVersion: 17
defaultFields:
- id
- name
- folder_id
- mimetype
- file_size
- create_date
defaultDetailFields:
- id
- name
- folder_id
- mimetype
- file_size
- create_date
dateFields:
  create_date: datetime
fieldSets: {}
operations: []
customOperations:
- name: folders
  description: List document folders across supported schemas.
  targets:
  - python
  - asyncPython
  - typescript
  - swift
- name: resolveFolder
  description: Resolve a folder reference.
  targets:
  - python
  - asyncPython
  - typescript
  - swift
- name: upload
  description: Upload an in-memory document.
  targets:
  - python
  - asyncPython
  - typescript
  - swift
- name: downloadFile
  description: Download a document into memory.
  targets:
  - python
  - asyncPython
  - typescript
  - swift
